# 2.x is scripts under scripts/, run by path with the standard library only.
# 3.x is the Desk, the installable package under src/ashigaru: the service,
# and later its CLI and MCP server, are one Python project (ashigaru-3.md).
# The lockfile also pins the gate's own tools: without mypy and pytest in it
# the gate exits 2 (python-sdlc, need_lock_dep).
[project]
name = "ashigaru"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=4.2",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.scripts]
ashigaru-desk = "ashigaru.desk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashigaru"]

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=1.14", "pytest>=8.3", "pyyaml>=6.0.3"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["scripts", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.pytest.ini_options]
pythonpath = ["scripts", "src"]
testpaths = ["tests"]

# The 2.x scripts by path, and the 3.x package from src/. pytest puts both on
# sys.path via [tool.pytest.ini_options] pythonpath.
[tool.mypy]
files = ["scripts", "src", "tests"]
mypy_path = "scripts:src"
ignore_missing_imports = true

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

