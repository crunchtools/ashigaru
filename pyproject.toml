# 2.x is scripts under scripts/, run by path with the standard library only.
# 3.x is the Desk, the installable package under src/ashigaru: the service,
# and later its CLI and MCP server, are one Python project (ashigaru-3.md).
# The lockfile also pins the gate's own tools: without mypy and pytest in it
# the gate exits 2 (python-sdlc, need_lock_dep).
#
# The service's web stack is the `desk` extra, so the CLI installs without it
# (the `ashigaru` RPM; `ashigaru-desk` adds it, packaging/ashigaru.spec). The
# hosted MCP is the `mcp` extra, in the image only: Fedora and EPEL do not
# package fastmcp, so the RPM Desk serves no /mcp. The
# version is VERSION's, so the wheel, the RPM and the release tag agree.
[project]
name = "ashigaru"
dynamic = ["version"]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["httpx>=0.28", "pydantic>=2.9"]

[project.optional-dependencies]
desk = ["fastapi>=0.115", "uvicorn>=0.32"]
mcp = ["fastmcp>=4.2"]

[project.scripts]
ashigaru = "ashigaru.cli.__main__:main"
ashigaru-desk = "ashigaru.desk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/ashigaru"]

# The version is VERSION's, which uv does not watch by default: without this, an environment
# synced before a release keeps the old version's metadata after it.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[dependency-groups]
dev = ["ashigaru[desk,mcp]", "mypy>=1.14", "pytest>=8.3", "pyyaml>=6.0.3"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["scripts", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.pytest.ini_options]
pythonpath = ["scripts", "src"]
testpaths = ["tests"]

# The 2.x scripts by path, and the 3.x package from src/. pytest puts both on
# sys.path via [tool.pytest.ini_options] pythonpath.
[tool.mypy]
files = ["scripts", "src", "tests"]
mypy_path = "scripts:src"
ignore_missing_imports = true

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["workflow-automation"]
# The release image is built by the `image` job, which plans the container build.
stacks = ["container"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/ashigaru"
boot = "healthcheck"
# Not enforced yet: sdlc runs no contract-test until sdlc#118 (sdlc#168). Kept so
# the gate returns with it.
contract-test = "packaging/container-test.sh"

[tool.sdlc.ci]
# pytest on Python 3.15 as well as the gate's 3.14 (what ci.yml's py315 job ran).
checks = ["py315-image", "py315"]

[tool.sdlc.ci.py315-image]
kind = "image-build"
containerfile = "ci/py315.Containerfile"
context = "ci"
tag = "localhost/ashigaru:py315"

[tool.sdlc.ci.py315]
kind = "command"
image = "localhost/ashigaru:py315"
argv = ["uv", "run", "--locked", "--python", "/usr/bin/python3", "pytest", "-q", "-p", "no:cacheprovider"]
env = { UV_PROJECT_ENVIRONMENT = "/tmp/venv", UV_PYTHON_DOWNLOADS = "never" }
# uv sync fetches uv.lock's wheels from PyPI.
network = true
