---
# The Worker's fresh-host test: one throwaway VM that is both the only seat
# host and the only login target. Its address comes from the environment
# (ASHIGARU_VM), so nothing here names a real host. tests/vm/README.md.
all:
  children:
    seat_hosts:
      hosts:
        vm:
          ansible_host: "{{ lookup('env', 'ASHIGARU_VM') }}"
          # A throwaway VM's host key is new every run.
          ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
    servers:
      hosts: {}
    seat_audit_hosts:
      children:
        seat_hosts:
  vars:
    ansible_user: root
