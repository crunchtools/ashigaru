---
# An example Worker inventory. Copy this directory somewhere private and put
# your own addresses in it; the real one names internal hosts and does not
# belong in this public repository. Documentation addresses (RFC 5737) only.
all:
  children:
    # Hosts that run seats: the host role and the seat role target these.
    seat_hosts:
      hosts:
        desk1:
          ansible_host: 192.0.2.20
          ansible_ssh_common_args: -o HostKeyAlias=desk1
    # Hosts seats may ssh into but that run none.
    servers:
      hosts:
        server1:
          ansible_host: 192.0.2.1
          ansible_ssh_common_args: -o HostKeyAlias=server1
    # Every host that logs seat logins and keeps a key map.
    seat_audit_hosts:
      children:
        seat_hosts:
        servers:
  vars:
    ansible_user: root
