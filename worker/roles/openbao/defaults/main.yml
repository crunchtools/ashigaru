# The kv path prefix and the AppRole names' stem: one trust domain per host.
openbao_prefix: "{{ inventory_hostname }}"
openbao_dir: "{{ seat_services_dir }}/openbao"
openbao_packages: [podman, openssl, jq, curl, python3]
