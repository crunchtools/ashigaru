---
- name: Load the seat audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Check and reload sshd
  ansible.builtin.shell: sshd -t && systemctl reload sshd
  changed_when: true

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
