# /etc/sysctl.d/60-ptrace-scope.conf on Dolza (a1038), defence in depth.
# Apply: sudo sysctl --system   (Scott: needs sudo, which the seats do not have)
#
# Yama 1: a process may ptrace only its own descendants. Dolza runs 0, so any
# process could attach to any other of the same uid -- and every agents-pod
# member is smccarty underneath. The pod split is the boundary (separate PID
# namespaces: another class's processes do not exist in /proc). This narrows
# what is left: in-class injection, and anything on the host as smccarty.
# It does NOT stop /proc/<pid>/environ or /proc/<pid>/root reads (those are
# PTRACE_MODE_READ, which Yama leaves alone): only the split does.
#
# What it costs on Dolza: `strace -p` / `gdb -p` on a process you did not
# start need sudo. Rootless podman (setns via podman unshare/nsenter) is not
# ptrace and keeps working.
kernel.yama.ptrace_scope = 1
