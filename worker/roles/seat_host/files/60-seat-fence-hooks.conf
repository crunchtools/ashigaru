# ~/.config/containers/containers.conf.d/ on Dolza, as smccarty (a1038; a1711).
# Every rootless podman smccarty runs -- the units and any hand-typed
# `podman start` -- reads this, so the seat fence hook runs whoever starts a
# seat. Rootless podman's default is /usr/share/containers/oci/hooks.d alone
# (checked), so this is what makes it read /etc's root-owned hook file.
# Root-owned dirs only: a user dir here would let anything running as
# smccarty add or shadow a hook. seat-fence-load --hooks and
# check_seat_fence refuse unless this file is in place, every dir it lists
# is root-owned, and the seat-fence.json that wins is /etc's, as shipped.
[engine]
hooks_dir = [
  "/usr/share/containers/oci/hooks.d",
  "/etc/containers/oci/hooks.d",
]
