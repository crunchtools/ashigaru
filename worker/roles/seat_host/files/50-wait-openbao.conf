# Wait for OpenBao to answer healthy (unsealed) before delivering, instead of
# failing once and never retrying. After= only orders against OpenBao's start
# attempt: on 2026-11-26 its first start failed, it came back 11 s later, and
# every srv-secrets@ had already failed, so trentina and all seats stayed down
# after the reboot (a1057).
[Service]
TimeoutStartSec=240
ExecStartPre=/usr/bin/bash -c 'for i in $(seq 1 180); do c=$(curl -s -o /dev/null -w "%%{http_code}" --cacert %h/.config/openbao/tls/ca.pem https://127.0.0.1:8200/v1/sys/health 2>/dev/null); [ "$c" = 200 ] && exit 0; sleep 1; done; echo "openbao not healthy in 180 s (last $c)" >&2; exit 1'
