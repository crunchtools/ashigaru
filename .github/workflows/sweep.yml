# Ashigaru sweep — triage the backlog quickly, start fixes on an hourly budget.
#
# Runs here only, not in consumer repos. It labels the oldest untriaged issues
# in enrolled repos `ready-for-triage`, using the Ashigaru app token so the
# label starts each repo's own Ashigaru workflow. A repo is enrolled when it
# carries .github/workflows/ashigaru.yml.
#
# It also starts the fixes that are waiting: issues labeled `ready-to-code` with no
# pull request yet, and Ashigaru pull requests that conflict. `code_per_hour` is
# the budget: fixes started per hour across every repo, counting the pull
# requests Ashigaru already opened in the past hour.
#
# Last, it looks after what only a person can move. It keeps one issue here,
# labeled `ashigaru-inbox`, listing outside contributions and work Ashigaru
# stopped on, and it sends up to five outside pull requests per run to
# review.yml for a first-pass review comment.
#
# A second job cuts releases where a repository asked for them with a topic:
# `ashigaru-release-pr` or `ashigaru-release-auto`. It opens the release pull
# request from the changelog and, once that has merged, publishes the tag and
# the GitHub Release. It keeps one issue here, labeled `ashigaru-releases`,
# listing what shipped and what is merged and waiting. See docs/release.md.

name: Ashigaru sweep

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      limit:
        description: "Issues to queue for triage in this run (the script caps it at 20)."
        type: number
        default: 20
      code_per_hour:
        description: "Fixes to start per hour across all repos."
        type: number
        default: 5
      dry_run:
        description: "List what would be queued without labeling."
        type: boolean
        default: false

permissions: {}

jobs:
  sweep:
    name: Queue untriaged issues
    if: vars.ASHIGARU_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      reviews: ${{ steps.sweep.outputs.reviews }}
    steps:
      # Always the default branch: a manual run started from another branch must
      # not put that branch's scripts next to the app token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint the Ashigaru app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ASHIGARU_APP_ID }}
          private-key: ${{ secrets.ASHIGARU_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Queue triage and start waiting fixes
        id: sweep
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # A schedule has no inputs; a manual 0 stays 0.
          LIMIT: ${{ github.event_name == 'schedule' && 20 || inputs.limit }}
          CODE_PER_HOUR: ${{ github.event_name == 'schedule' && 5 || inputs.code_per_hour }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--org "$GITHUB_REPOSITORY_OWNER" --limit "$LIMIT" --code-per-hour "$CODE_PER_HOUR"
                --inbox-repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/sweep.py "${args[@]}"

  release:
    name: Cut releases
    if: vars.ASHIGARU_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two runs at once would open the same release pull request twice.
    concurrency:
      group: ashigaru-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # This workflow is not reusable: it runs in the Ashigaru repository only, so
      # the scripts beside it on the default branch are the release's own.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint the reading token
        id: reader
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ASHIGARU_APP_ID }}
          private-key: ${{ secrets.ASHIGARU_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Find the releases that are due
        id: plan
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--plan "$RUNNER_TEMP/releases.json" --org "$GITHUB_REPOSITORY_OWNER")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/release.py plan "${args[@]}"

      # The token that can push and publish exists only in an hour with a release
      # to cut, and covers only the repositories that have one.
      - name: Mint the writing token
        id: writer
        if: steps.plan.outputs.repos != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ASHIGARU_APP_ID }}
          private-key: ${{ secrets.ASHIGARU_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.plan.outputs.repos }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open release pull requests and publish merged ones
        if: steps.plan.outputs.repos != ''
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
        run: python3 scripts/release.py act --plan "$RUNNER_TEMP/releases.json"

      - name: Record what shipped and what waits
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--plan "$RUNNER_TEMP/releases.json" --repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/release.py record "${args[@]}"

  review:
    name: Review ${{ matrix.repo }}#${{ matrix.number }}
    needs: sweep
    if: needs.sweep.outputs.reviews != '' && needs.sweep.outputs.reviews != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.sweep.outputs.reviews) }}
    permissions:
      contents: read
    uses: ./.github/workflows/review.yml
    with:
      repo: ${{ matrix.repo }}
      number: ${{ matrix.number }}
      sha: ${{ matrix.sha }}
      base: ${{ matrix.base }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ASHIGARU_APP_ID: ${{ secrets.ASHIGARU_APP_ID }}
      ASHIGARU_APP_KEY: ${{ secrets.ASHIGARU_APP_KEY }}
