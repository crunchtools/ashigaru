name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdlc:
    name: sdlc ci
    # No ASHIGARU_ENABLED switch: this job runs no model, and it is a required
    # check, so a skipped run would count as passed (constitution XII). The
    # switch stops the workflows that run a model (docs/authority.md).
    # Our own runners (crunchtools/gha-runner on exedore) for same-repo PRs and
    # pushes; forks and Dependabot stay on GitHub's machines. Clearing the org
    # variable CACHED_RUNNER_LABEL or UNCACHED_RUNNER_LABEL is the kill switch.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (vars.CACHED_RUNNER_LABEL || 'ubuntu-latest')
          || github.event_name != 'pull_request'
          && (vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || 'ubuntu-latest' }}
    # The replaced job had `timeout-minutes: 10`. Without one a hung check
    # holds a runner until GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # .sdlc/bin/sdlc asks the image for its own launcher, so the launcher, the
      # image and every tool float together. SDLC_IMAGE comes only from the
      # repository variable (latest when unset; main, X.Y.Z or @sha256:<digest>).
      - name: sdlc ci
        env:
          SDLC_IMAGE: ${{ vars.SDLC_IMAGE }}
        run: .sdlc/bin/sdlc ci

  # Python 3.15, on the Fedora 45 image the fc45 RPM is built for: sdlc ci tests
  # on the image's own Python, so this is the one run on the newest. The
  # interpreter is the distro's, never a download; the dependencies are uv.lock's.
  py315:
    name: pytest (Python 3.15, Fedora 45)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Install Python, git and uv
        run: |
          dnf -y -q install python3 python3-pip git
          python3 -m pip install -q --root-user-action=ignore uv==0.13.7

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The checkout belongs to the runner's user, not the container's root, and
      # git refuses a repository it does not own (tests/test_rpm.py runs git).
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync the locked dependencies
        run: uv sync --locked --python /usr/bin/python3

      - name: pytest
        run: |
          uv run --no-sync python -V
          uv run --no-sync pytest -q

  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0
