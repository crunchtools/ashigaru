name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdlc:
    name: sdlc ci
    # The kill switch, on the FIRST job of the workflow, as every other
    # workflow here does it. The job this replaced carried it; dropping it
    # would have left one workflow that ASHIGARU_ENABLED=false does not stop.
    if: vars.ASHIGARU_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The replaced job had `timeout-minutes: 10`. Without one a hung check
    # holds a runner until GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release is read from .pre-commit-config.yaml, so one line pins the
      # launcher, the image and every tool in it, for the laptop and CI both.
      - name: sdlc ci
        run: |
          set -eu
          rev=$(awk '/repo: https:\/\/github.com\/crunchtools\/python-sdlc/ {f=1; next}
                     f && /rev:/ {print $2; exit}' .pre-commit-config.yaml)
          [ -n "$rev" ] || { echo "no python-sdlc rev in .pre-commit-config.yaml" >&2; exit 2; }
          git clone -q --depth 1 --branch "$rev" https://github.com/crunchtools/python-sdlc "$RUNNER_TEMP/sdlc"
          $RUNNER_TEMP/sdlc/bin/sdlc ci

  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0
