name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdlc:
    name: sdlc ci
    # No ASHIGARU_ENABLED switch: this job runs no model, and it is a required
    # check, so a skipped run would count as passed (constitution XII). The
    # switch stops the workflows that run a model (docs/authority.md).
    runs-on: ubuntu-latest
    # The replaced job had `timeout-minutes: 10`. Without one a hung check
    # holds a runner until GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # .sdlc/bin/sdlc asks the image for its own launcher, so the launcher, the
      # image and every tool float together. SDLC_IMAGE comes only from the
      # repository variable (latest when unset; main, X.Y.Z or @sha256:<digest>).
      - name: sdlc ci
        env:
          SDLC_IMAGE: ${{ vars.SDLC_IMAGE }}
        run: .sdlc/bin/sdlc ci

  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0
