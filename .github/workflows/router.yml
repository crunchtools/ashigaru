# Ashigaru router (reusable) — the one workflow a repository's caller names.
#
# GitHub lets only the caller declare triggers and jobs; a called workflow can
# add neither. So the caller subscribes to every event Ashigaru uses or may use,
# passes its secrets, and this file decides what runs. A new job here reaches
# every enrolled repository at the next release, with no file copied anywhere.
#
#   issues opened, or labeled ready-for-triage  -> triage (then code, if it says so)
#   issues labeled ready-to-code                -> code
#   Gatehouse completed on an ashigaru/ branch  -> fix
#   Ashigaru's release pull request merged      -> release (even when switched off)
#   anything else                               -> ignore
#
# Each gate is the one the caller carried before, and each called workflow
# checks it again. Release alone ignores ASHIGARU_ENABLED: it runs no model, and
# a release pull request that merged must still be tagged once Ashigaru is off. `ignore` is the fallback: no permissions, no secrets, one
# step. Nothing here checks out anything, so no pull request's code runs under
# pull_request_target. Each call gets only the secrets it needs.

name: Ashigaru router

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      ASHIGARU_APP_KEY:
        required: true
      OPENROUTER_API_KEY:
        description: "For the Gatehouse pre-commit hook. Without it that hook is skipped."
        required: false

permissions: {}

jobs:
  triage:
    name: Triage
    if: >-
      vars.ASHIGARU_ENABLED == 'true' &&
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.label.name == 'ready-for-triage')
    permissions:
      contents: read
      issues: write
    uses: crunchtools/ashigaru/.github/workflows/triage.yml@v4
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  code:
    name: Code
    needs: triage
    # After a triage that said ready-to-code, or when a maintainer adds the label.
    if: >-
      always() && vars.ASHIGARU_ENABLED == 'true' &&
      github.event_name == 'issues' &&
      (needs.triage.outputs.auto_code == 'true' ||
       (github.event.action == 'labeled' && github.event.label.name == 'ready-to-code'))
    permissions:
      contents: read
      issues: read
    uses: crunchtools/ashigaru/.github/workflows/code.yml@v4
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ASHIGARU_APP_KEY: ${{ secrets.ASHIGARU_APP_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  fix:
    name: Fix
    if: >-
      vars.ASHIGARU_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'ashigaru/')
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    uses: crunchtools/ashigaru/.github/workflows/fix.yml@v4
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ASHIGARU_APP_KEY: ${{ secrets.ASHIGARU_APP_KEY }}

  release:
    name: Release
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'ashigaru/release-')
    permissions:
      contents: read
    uses: crunchtools/ashigaru/.github/workflows/release-tag.yml@v4
    secrets:
      ASHIGARU_APP_KEY: ${{ secrets.ASHIGARU_APP_KEY }}

  ignore:
    name: Nothing to do
    # Exactly when no job above starts. tests/test_router.py holds the two in step.
    if: >-
      vars.ASHIGARU_ENABLED == 'true' &&
      !(github.event_name == 'issues' &&
        (github.event.action == 'opened' || github.event.label.name == 'ready-for-triage' ||
         (github.event.action == 'labeled' && github.event.label.name == 'ready-to-code'))) &&
      !(github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request_target' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'ashigaru/')) &&
      !(github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'ashigaru/release-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Nothing to do
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: echo "Ashigaru does not act on $EVENT $ACTION."
