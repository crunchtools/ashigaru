# Ashigaru release (reusable) — kept for callers copied at 2.13.1.
#
# Those callers name this file directly; a caller copied at 2.14.0 or later goes
# through router.yml. Both now reach release-tag.yml, which tags a merged
# release pull request whether or not ASHIGARU_ENABLED is true (docs/release.md).

name: Ashigaru release

on:
  workflow_call:
    inputs:
      bot:
        description: "Slug of the app that opens Ashigaru pull requests."
        type: string
        default: "ashigaru-crunchtools-com"
    secrets:
      ASHIGARU_APP_KEY:
        required: true

permissions: {}

jobs:
  publish:
    name: Publish the release
    permissions:
      contents: read
    uses: crunchtools/ashigaru/.github/workflows/release-tag.yml@v5
    with:
      bot: ${{ inputs.bot }}
    secrets:
      ASHIGARU_APP_KEY: ${{ secrets.ASHIGARU_APP_KEY }}
