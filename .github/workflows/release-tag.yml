# Ashigaru release tag (reusable) — tag a release the moment its pull request merges.
#
# What release.yml did until 2.14.0, without the switch: ASHIGARU_ENABLED stops
# the agents and the sweep, not the tagging of a release pull request that has
# already merged. Turning Ashigaru off must not stop container.yml and
# publish.yml from running in every repository whose release is in flight.
#
# No LLM, and nothing from the pull request is checked out. The gate is the one
# release.yml carried: a merged `ashigaru/release-*` branch of this repository.
# scripts/release_publish.py then checks the rest from the API (the author is
# the app, the base is the default branch, a release topic is set and
# `ashigaru-observe` is not) and tags the merge commit. The token is the app's,
# not GITHUB_TOKEN: a tag made with GITHUB_TOKEN starts no workflow. The actions
# that hold that token are pinned by commit, not by a tag their owner can move.

name: Ashigaru release tag

on:
  workflow_call:
    inputs:
      bot:
        description: "Slug of the app that opens Ashigaru pull requests."
        type: string
        default: "ashigaru-crunchtools"
    secrets:
      ASHIGARU_APP_KEY:
        required: true

permissions: {}

jobs:
  publish:
    name: Publish the release
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'ashigaru/release-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch Ashigaru
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: crunchtools/ashigaru
          ref: v2
          path: .ashigaru-src
          persist-credentials: false

      - name: Move Ashigaru out of the workspace
        run: mv .ashigaru-src "$RUNNER_TEMP/ashigaru"

      - name: Mint the Ashigaru app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.ASHIGARU_CLIENT_ID }}
          private-key: ${{ secrets.ASHIGARU_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read

      - name: Tag the merge commit and publish the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL: ${{ github.event.pull_request.number }}
          BOT: app/${{ inputs.bot }}
        run: |
          python3 "$RUNNER_TEMP/ashigaru/scripts/release_publish.py" --repo "$GITHUB_REPOSITORY" \
            --pull "$PULL" --bot "$BOT"
