# Gourmand Exceptions

# Ruff is not missing; it moved. Gourmand's IF001 looks for a literal
# `ruff-check` hook id, and under python-sdlc (constitution XII, v1.30.0) ruff
# runs inside the `sdlc-commit` hook, configured by [tool.ruff] in
# pyproject.toml. Same precedent as trentina.
[[exceptions]]
check = "linter_configuration"
path = ".pre-commit-config.yaml"
pattern = "ruff-check"
justification = "ruff runs inside the sdlc-commit hook from python-sdlc (constitution XII v1.30.0), configured by [tool.ruff] in pyproject.toml; Gourmand looks for a literal ruff hook id"
classification = "by_design"

# A Claude Code hook must never stand between a person and their prompt: every
# failure is reported on stderr and the hook exits 0 (the seat-state.json hooks
# it replaces did the same). Printing IS the handling.
[[exceptions]]
check = "redundant_error_handling"
path = "src/ashigaru/cli/hooks.py"
pattern = "run"
justification = "a Claude Code hook reports every failure on stderr and exits 0 so it never blocks a prompt; the catch is the contract, not a just-in-case"
classification = "by_design"

# The seam for the CI callback: today it returns the poller, and once the Desk
# serves desk_wait it picks the callback waiter without commands.wait changing.
[[exceptions]]
check = "over_abstraction"
path = "src/ashigaru/cli/wait.py"
pattern = "waiter_for"
justification = "the seam the brief asked for: it picks the poller until the Desk's CI callback (desk_wait) exists, then the callback waiter, so commands.wait never changes"
classification = "by_design"

[[exceptions]]
check = "single_use_helpers"
path = "src/ashigaru/cli/wait.py"
pattern = "_poll"
justification = "isolates the retry-on-blip policy (no answer or a 5xx means poll again) from the backoff loop; inlined, the loop needs an empty except to swallow the blip"
classification = "by_design"

[[exceptions]]
check = "single_use_helpers"
path = "src/ashigaru/cli/wait.py"
item = "_ask"
justification = "CIWaiter's twin of _poll: isolates the retry-on-blip policy (unreachable or a 5xx means ask again, a 404 means no CI wait) from the deadline loop; inlined, the loop needs an empty except to swallow the blip"
classification = "by_design"

# Shape, not copy: relock's guard-then-early-return run (a lockfile command)
# and the status line's throttle (load state, check age, count, save) share
# statement kinds and nothing else.
[[exceptions]]
check = "copy_paste_detection"
path = "scripts/relock.py"
item = "relock"
justification = "matched only against hooks._throttled, a status line throttle with no shared logic; the similarity is a run of guards and early returns"
classification = "gourmand_bug"

# Shape, not copy: the seat board opens with a run of plain assignments and one
# guard, which normalizes to the same statements as required_checks' cache
# lookup and as table's column fitting. Neither shares a line of logic with it.
[[exceptions]]
check = "copy_paste_detection"
path = "src/ashigaru/cli/render.py"
item = "seat_board"
justification = "matched against forges.github.required_checks (a cached ruleset lookup) on statement shape alone: a run of assignments and one guard, no shared logic"
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/ashigaru/cli/render.py"
item = "table"
justification = "matched against seat_board, which builds the board's sections and calls table; table's column fitting shares only a run of assignments with it"
classification = "gourmand_bug"

# _combine is GitHub's rule for several reports of one check (pending wins,
# then a failure, then a pass). `reported` applies it per name and App and
# `GitHub.required` per requirement; Gourmand misses the call in `reported`'s
# dict comprehension and counts one caller.
[[exceptions]]
check = "single_use_helpers"
path = "src/ashigaru/desk/forges/github.py"
pattern = "_combine"
justification = "the one rule for several reports of a check, called from both reported and GitHub.required; Gourmand misses the comprehension call site"
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/ashigaru/desk/dispatch.py"
item = "_waiting_seat"
justification = "matched against store.write_seat (and before that release.survey) on statement shape alone: a seat lookup, guards and one query, no shared logic"
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/ashigaru/desk/forges/github.py"
item = "GitHub.subject"
justification = "matched against dispatch.assign_in, relock, hooks and render on statement shape alone (a read, guards, one write and a return); an issue fetch shares no logic with any of them"
classification = "gourmand_bug"

# [tool.sdlc.ci.py315] runs in sdlc's nested container, where the repo is
# mounted read-only at /repo and /tmp is the one writable tmpfs: the venv has
# to live there. It is a path inside that container, not on any host.
[[exceptions]]
check = "absolute_paths"
path = "pyproject.toml"
pattern = "/tmp"
justification = "the py315 command's venv lives on the sdlc command container's /tmp tmpfs because /repo is mounted read-only; a container path, never a host one"
classification = "by_design"
