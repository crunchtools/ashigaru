[[findings]]
agent = "bugs"
category = "bug"
file = "src/ashigaru/desk/model.py"
evidence = "if github := GITHUB_URL.match(ref) or REPO_REF.match(ref):\n    return f\"{github[1]}#{github[2]}\""
status = "not-a-bug"
reason = "Deliberate: a canonical owner/repo#N key must pass through unchanged, and the webhook keys on the repository's full_name as GitHub returns it; lowercasing here would make the two disagree for any repository with capitals."
